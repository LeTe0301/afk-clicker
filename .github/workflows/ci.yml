name: Tests

# Every pull request, and every push to main. Fast on purpose -- the slow chord
# suite synthesises real key presses and takes minutes, so it belongs to the
# release pipeline, not to the feedback loop on a branch.
#
# Push is limited to main because a branch with an open PR would otherwise run
# the whole matrix twice per commit (push + pull_request), and every failure
# arrived as two emails. A branch without a PR can still be run by hand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Supersede an in-flight run when a branch is pushed again; the old result is
# about code nobody has any more.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # The suite used to run on Linux only, which left the Windows and macOS
    # code paths -- %APPDATA%, the .app bundle nesting, file:// URLs on a
    # drive path -- covered by nothing but a build.
    #
    # macOS is a required leg, not continue-on-error. That flag was here for
    # Accessibility permission a runner cannot grant, but the two failures it
    # actually absorbed were real cross-platform bugs, and it reported the run
    # green with the job red -- which is the failure mode a test matrix exists
    # to prevent.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tkinter is available
        run: python -c "import tkinter; print('tkinter', tkinter.TkVersion)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pynput==1.7.7"

      - name: Install a virtual display (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      # pynput resolves its X11 backend at import time and raises without a
      # display, so on Linux the whole suite needs one -- not just the window
      # tests. Windows and macOS have a window server either way.
      #
      # --server-args raises Xvfb's own default client cap (256, the classic
      # X11 protocol limit): this suite builds a fresh tk.Tk() (an Xlib
      # client) per test across ~150+ UI-building test classes, several of
      # which now also open a second Xlib connection each via pynput's mouse
      # AND keyboard Controllers (G#47/GH#15's MacroRunner needs its own),
      # plus test_updater.py's own subprocesses that re-import afk_clicker
      # and open their own connections. With gc.disable() in effect for the
      # whole run (tests/context.py), a finished test's connection is not
      # guaranteed to close before the next one opens, so the running total
      # can exceed 256 well before the suite ends -- reproduced directly:
      # "Xlib.error.DisplayConnectionError: ... Maximum number of clients
      # reached" (CI run 36489585846, ubuntu-latest). 2048 is a generous
      # multiple of what the suite currently needs, not a tuned minimum.
      - name: Run the test suite (Linux)
        if: runner.os == 'Linux'
        env:
          CI: "true"
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24 -maxclients 2048" python -m unittest discover -s tests -t . -v

      - name: Run the test suite (Windows / macOS)
        if: runner.os != 'Linux'
        env:
          CI: "true"
          # PR #107: macos-latest segfaulted (exit 139) with zero Python-level
          # output -- RailCollapse.test_add_current_game_button_survives_collapse,
          # a real-WM-driven geometry()+update() that rebuilds the sidebar
          # footer, the kind of native Tcl/Tk crash faulthandler exists for.
          # This does not fix that crash (its cause sits below anything this
          # repo's Python code controls -- see docs/history/ac-60-implementation.md's
          # own Xvfb-only collapsed-rail check, which already shows the same
          # rebuild producing the correct ['+', '↑', '↓'] result with no
          # issue there); it only ensures a recurrence prints which Python
          # line was running at the moment of the signal instead of nothing.
          PYTHONFAULTHANDLER: "1"
        run: python -m unittest discover -s tests -t . -v
