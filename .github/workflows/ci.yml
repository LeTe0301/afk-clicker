name: Tests

# Every push and every pull request. Fast on purpose -- the slow chord suite
# synthesises real key presses and takes minutes, so it belongs to the release
# pipeline, not to the feedback loop on a branch.
on:
  push:
    branches-ignore: ["release/**"]     # release/** runs the full pipeline instead
  pull_request:
  workflow_dispatch:

# Supersede an in-flight run when a branch is pushed again; the old result is
# about code nobody has any more.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # The suite used to run on Linux only, which left the Windows and macOS
    # code paths -- %APPDATA%, the .app bundle nesting, file:// URLs on a
    # drive path -- covered by nothing but a build.
    #
    # macOS is a required leg, not continue-on-error. That flag was here for
    # Accessibility permission a runner cannot grant, but the two failures it
    # actually absorbed were real cross-platform bugs, and it reported the run
    # green with the job red -- which is the failure mode a test matrix exists
    # to prevent.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tkinter is available
        run: python -c "import tkinter; print('tkinter', tkinter.TkVersion)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pynput==1.7.7"

      - name: Install a virtual display (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      # pynput resolves its X11 backend at import time and raises without a
      # display, so on Linux the whole suite needs one -- not just the window
      # tests. Windows and macOS have a window server either way.
      - name: Run the test suite (Linux)
        if: runner.os == 'Linux'
        env:
          CI: "true"
        run: xvfb-run -a python -m unittest discover -s tests -t . -v

      - name: Run the test suite (Windows / macOS)
        if: runner.os != 'Linux'
        env:
          CI: "true"
        run: python -m unittest discover -s tests -t . -v
